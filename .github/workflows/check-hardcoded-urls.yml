name: Check for hardcoded URLs

on:
  pull_request:

# Read-only: the job only checks out the tree and greps it.
permissions:
  contents: read

jobs:
  hardcoded-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List hardcoded URLs
        run: ./scripts/list-hardcoded-urls.sh
